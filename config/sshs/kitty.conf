# sshs – Kitty-Fenster für einen Server (Symlink ~/.config/kitty/sshs.conf, gestartet von scripts/sshs).
# Alles wie im normalen Kitty, dazu: Tabs immer sichtbar, Stack-Layout (Terminal und Dateien liegen übereinander).
include kitty.conf

enabled_layouts stack
tab_bar_min_tabs 1
# xterm-kitty kennt auf dem Server nur der Anmelde-Benutzer (kitten ssh legt es in sein ~), nach sudo -i/su
# hieß es sonst „unknown terminal type“ – xterm-256color kennt jeder
term xterm-256color

# Strg+Leertaste: Terminal <-> Dateien (yazi per SFTP), der Ordner wandert mit
map ctrl+space kitten sshs_kitten.py toggle
# Strg+Shift+T: neuer Tab zum selben Server, im aktuellen Ordner
map ctrl+shift+t kitten sshs_kitten.py new_tab
# Strg+Shift+U: Dateien hochladen in den Ordner, der gerade offen ist (statt Kittys Unicode-Eingabe)
map ctrl+shift+u kitten sshs_kitten.py upload
# Strg+Shift+D: Dateien aus dem Ordner, der gerade offen ist, nach ~/Downloads holen
map ctrl+shift+d kitten sshs_kitten.py download
