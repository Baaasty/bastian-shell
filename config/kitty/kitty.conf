# Kitty im Desktop-Look (Variante hearth) – von Hand gepflegt.
# Farben kommen aus theme/out/kitty/theme.conf (erzeugt: theme/gen/kitty.py).
# Einbinden/zurücknehmen: scripts/kitty-theme install|off|status
# Regel: Super und Alt gehören Hyprland (Super = Fenster, Alt = Workspaces).
#        Kitty-Kürzel nur mit Ctrl+Shift. Tabelle: docs/THEMING.md "Kitty-Kürzel".

include theme.conf

# ---------- Font ----------
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.5
disable_ligatures cursor
# Nerd-Font symbols fall back automatically; keep Inter out of the terminal.

# ---------- Look ----------
background_opacity   1.0
window_padding_width 12 14
window_margin_width  0
window_border_width  1px
draw_minimal_borders yes
hide_window_decorations no
confirm_os_window_close 0
dynamic_background_opacity no

# ---------- Cursor: calm bar, no blinking ----------
cursor_shape          beam
cursor_beam_thickness 1.6
cursor_blink_interval 0
cursor_stop_blinking_after 0

# ---------- Scrollback ----------
scrollback_lines 20000
scrollback_pager less --ignore-case --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER
mouse_hide_wait  3.0
wheel_scroll_multiplier 3.0

# ---------- Mouse / selection ----------
copy_on_select          clipboard
strip_trailing_spaces   smart
select_by_word_characters @-./_~?&=%+#:
# URL hover: underlined, open with Ctrl+Left-click (kitty default mouse map)
url_style               curly
open_url_with           default
detect_urls             yes
show_hyperlink_targets  yes

# ---------- Tabs ----------
tab_bar_edge           top
tab_bar_style          separator
tab_separator          ""
tab_bar_min_tabs       2
tab_title_template     "  {index}  {title}  "
active_tab_title_template "  {index}  {title}  "
active_tab_font_style  bold
inactive_tab_font_style normal
tab_bar_margin_height  0.0 0.0

# ---------- Layouts: splits + zoom (stack) ----------
enabled_layouts splits:split_axis=horizontal,stack

# ---------- Integration ----------
shell_integration enabled
allow_remote_control no
update_check_interval 0
enable_audio_bell no
visual_bell_duration 0
window_alert_on_bell yes
linux_display_server auto
wayland_titlebar_color background
remember_window_size no
initial_window_width  120c
initial_window_height 36c

# ======================= Shortcuts =======================
# Drop all kitty defaults so nothing collides with Hyprland or with these.
clear_all_shortcuts yes

# --- Tabs ---
map ctrl+shift+t new_tab_with_cwd
# Ctrl+Tab / Ctrl+Shift+Tab cycle forward / backward
map ctrl+tab next_tab
map ctrl+shift+tab previous_tab
map ctrl+shift+1 goto_tab 1
map ctrl+shift+2 goto_tab 2
map ctrl+shift+3 goto_tab 3
map ctrl+shift+4 goto_tab 4
map ctrl+shift+5 goto_tab 5
map ctrl+shift+6 goto_tab 6
map ctrl+shift+7 goto_tab 7
map ctrl+shift+8 goto_tab 8
map ctrl+shift+9 goto_tab 9
map ctrl+shift+w close_tab

# --- Splits (same working directory) ---
map ctrl+shift+enter launch --location=split --cwd=current
# Vertical divider (side by side). German layout: backslash is AltGr+ss, so the # key works too.
map ctrl+shift+backslash launch --location=vsplit --cwd=current
map ctrl+shift+numbersign launch --location=vsplit --cwd=current
# Horizontal divider (stacked)
map ctrl+shift+minus launch --location=hsplit --cwd=current
map ctrl+shift+left  neighboring_window left
map ctrl+shift+right neighboring_window right
map ctrl+shift+up    neighboring_window up
map ctrl+shift+down  neighboring_window down
map ctrl+shift+z toggle_layout stack
map ctrl+shift+q close_window

# --- Copy / paste ---
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
# Ctrl+C copies when there is a selection, otherwise it stays SIGINT
map ctrl+c copy_and_clear_or_interrupt
map shift+insert paste_from_selection

# --- Scrollback ---
# Opens the scrollback in less; press / to search, n/N next/previous, q to leave.
map ctrl+shift+f show_scrollback
map shift+page_up   scroll_page_up
map shift+page_down scroll_page_down
map ctrl+shift+home scroll_home
map ctrl+shift+end  scroll_end
map ctrl+shift+k clear_terminal to_cursor active

# --- Font size ---
map ctrl+plus        change_font_size current +1.0
map ctrl+equal       change_font_size current +1.0
map ctrl+shift+equal change_font_size current +1.0
map ctrl+minus       change_font_size current -1.0
map ctrl+0           change_font_size current 0

# --- Link hints ---
# Ctrl+Shift+E: letters on every URL, press the letters to open it.
map ctrl+shift+e open_url_with_hints

# --- Pfad kopieren ---
# Ctrl+Shift+P: aktuellen Ordner des Fensters in die Zwischenablage
map ctrl+shift+p launch --type=background --cwd=current sh -c 'pwd | wl-copy -n'
