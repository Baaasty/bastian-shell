# ERZEUGT aus theme/palette.json (hearth) – nicht von Hand ändern.
# Neu erzeugen: python3 -I theme/gen/hypr.py [variante]   (läuft auch in theme/gen/all.py und scripts/rice variant)

general {
    border_size = 2
    gaps_in = 5
    gaps_out = 10
    # aktiv: Akzent, inaktiv: ruhiger Ton aus der Fläche (Glas-Varianten: Akzent gedämpft + Haarlinie)
    col.active_border = rgba(DB6B4CE6)
    col.inactive_border = rgba(6A5B50FF)
    col.nogroup_border = rgba(6A5B50FF)
    col.nogroup_border_active = rgba(DB6B4CE6)
}

decoration {
    rounding = 16
    rounding_power = 2
    active_opacity = 1.0
    inactive_opacity = 1.0
    dim_inactive = false

    # dezent und nur so weit wie nötig (Schatten kosten pro Fenster)
    shadow {
        enabled = true
        range = 12
        render_power = 3
        offset = 0 4
        color = rgba(0C07044C)
        color_inactive = rgba(0C07042E)
    }

    # Blur nur bei Varianten mit blur=true (hearth: aus, alles deckend). Wenige Pässe, kein Rauschen-Schnickschnack.
    blur {
        enabled = false
        size = 6
        passes = 2
        new_optimizations = true
        xray = false
        noise = 0.01
        contrast = 1.0
        brightness = 1.0
        vibrancy = 0.15
        vibrancy_darkness = 0.0
        special = false
        popups = false
        input_methods = false
    }
}

misc {
    background_color = rgba(2A211BFF)
}

# Kurz und ruhig: OutCubic wie motion.easing, keine Feder, kein Nachschwingen, nichts läuft dauerhaft
animations {
    enabled = true
}
bezier = desktopOut, 0.33, 1, 0.68, 1
animation = global, 1, 2.2, desktopOut
animation = windowsIn, 1, 2.4, desktopOut, popin 96%
animation = windowsOut, 1, 1.8, desktopOut, popin 96%
animation = windowsMove, 1, 2.4, desktopOut
animation = fade, 1, 1.8, desktopOut
animation = border, 1, 2.2, desktopOut
animation = borderangle, 0
animation = workspaces, 1, 2.4, desktopOut, fade
animation = specialWorkspace, 1, 2.4, desktopOut, fade
# Layer-Flächen (Bar, Dashboard, OSD …) animiert die Shell selbst – sonst doppelt
animation = layers, 0
animation = fadeLayers, 0
