# Chat-Client (Discord-RPM, Klasse "discord"; Rückfall Flatpak "com.discordapp.Discord", alt Equibop/Vesktop) und Spotify: Startplatz linker Monitor (HDMI-A-2), gekachelt (kein float, kein pin), nebeneinander.
# Auf ALLEN Workspaces sichtbar macht die Shell, nicht Hyprland: shell/services/Parked.qml (_follow) und
# Hypr.switchCmds schieben gekachelte, nicht weggeräumte Discord/Spotify-Fenster bei jedem Workspace-Wechsel per
# movetoworkspacesilent auf den aktiven Workspace ihres Monitors (links→rechts, Breite des rechten bleibt).
# Warum kein "pin on": Hyprland lehnt movetoworkspace(silent) für gepinnte Fenster ab – Wegräumen/Holen über die
# Bar-Chips (Parked, special:parked<slot>) und Alt+Shift+n liefen dann ins Leere.
# Kommt NACH rules.conf: überschreibt dort die Discord-Regel (monitor DP-2 …, "beim Rausholen mittig").
# Neue Fenster tiled dwindle mit force_split = 2 (general.conf): zweites Fenster landet rechts vom ersten.
# Gilt nur beim Öffnen (monitor); schon offene Fenster bleiben, wie sie sind.

windowrule = monitor HDMI-A-2, match:initial_class (?i)(discord|com\.discordapp\.discord|equibop|vesktop)
windowrule = monitor HDMI-A-2, match:initial_class (?i)(spotify|com\.spotify\.client)
