# Umgebungsvariablen – einzige Quelle. Zwei Leser:
#   1. Hyprland selbst (env = …, gilt für Hyprland und alles, was es direkt startet)
#   2. uwsm: ~/.config/uwsm/env-hyprland (von scripts/hypr install) liest genau diese Zeilen und exportiert sie
#      in die systemd-Umgebung, damit auch Apps aus "uwsm app --" und User-Dienste sie sehen.
# Format daher streng: env = NAME,Wert   (eine Variable pro Zeile, ohne Anführungszeichen, kein $ im Wert)
# XDG_CURRENT_DESKTOP, XDG_SESSION_TYPE, XDG_SESSION_DESKTOP setzt uwsm selbst.

# --- NVIDIA (nach Hyprland-Wiki, Seite „NVIDIA“; Treiber 615 open, nvidia_drm modeset+fbdev = Y) ---
# VA-API über libva-nvidia-driver (installiert): Hardware-Videodekodierung in Firefox/mpv
env = LIBVA_DRIVER_NAME,nvidia
# GLX-Bibliothek von NVIDIA statt Mesa (XWayland-Apps, Spiele)
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
# nvidia-vaapi-driver: direktes Backend (das EGL-Backend ist bei neueren Treibern kaputt)
env = NVD_BACKEND,direct
# Electron/Chromium nativ unter Wayland (VS Code, Discord, Helium) statt XWayland
env = ELECTRON_OZONE_PLATFORM_HINT,auto
# bewusst NICHT gesetzt: GBM_BACKEND=nvidia-drm (Firefox stürzt damit ab, wird nicht mehr gebraucht),
# __GL_VRR_ALLOWED (VRR steuert monitors.conf pro Monitor)

# --- Qt/KDE-Apps wie unter Plasma (Farbschema „Desktop“, Desktop-Icons, Breeze, Schriften aus kdeglobals) ---
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,kde
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
# Dolphin „Öffnen mit“ und Menüs finden die Programme nur mit dem Plasma-Menü
env = XDG_MENU_PREFIX,plasma-
# GTK-Apps nativ unter Wayland
env = GDK_BACKEND,wayland,x11,*
env = MOZ_ENABLE_WAYLAND,1

# --- Cursor: eigenes Theme „Desktop“ (theme/README.md) ---
env = XCURSOR_THEME,Desktop
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
