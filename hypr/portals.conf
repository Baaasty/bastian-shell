# xdg-desktop-portal unter Hyprland – scripts/hypr install verlinkt das nach
# ~/.config/xdg-desktop-portal/hyprland-portals.conf (gilt nur, wenn XDG_CURRENT_DESKTOP=Hyprland, Plasma bleibt unberührt).
# Bildschirm teilen/Screenshots über das Hyprland-Portal, alles andere (Dateidialog, Einstellungen, Öffnen mit)
# über das KDE-Portal – so sehen Dialoge aus wie unter Plasma (Farbschema „Desktop“).
[preferred]
default=kde
org.freedesktop.impl.portal.ScreenCast=hyprland
org.freedesktop.impl.portal.Screenshot=hyprland
org.freedesktop.impl.portal.GlobalShortcuts=hyprland
org.freedesktop.impl.portal.InputCapture=hyprland
org.freedesktop.impl.portal.RemoteDesktop=hyprland
