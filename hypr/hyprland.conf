# desktop – Hyprland-Einstieg (Branch hyprland). Wird nicht direkt geladen, sondern von
# ~/.config/hypr/hyprland.conf, die scripts/hypr install anlegt:
#
#   $DESKTOP = /home/<user>/Workspace/bastian-shell     (Repo-Pfad, nie hart in diesen Dateien)
#   source = $DESKTOP/hypr/hyprland.conf
#
# Format: hyprlang (.conf). Seit Hyprland 0.55 gilt es als veraltet (Lua ist neu), läuft in 0.56 aber noch
# mit einem Hinweis beim Start. Umstieg auf Lua siehe docs/knowledge/hyprland.md („Offene Lücken“).
# Prüfen ohne Start: scripts/hypr check

# gemeinsame Variablen für alle Teile
# qs-Instanz: derselbe absolute Pfad wie beim Start in autostart.conf, sonst findet IPC sie nicht
$SHELL_DIR = $DESKTOP/shell
$IPC = qs ipc --any-display -p $SHELL_DIR call
# Apps nie direkt starten (stürben mit der Shell/Hyprland): eigene systemd-Unit über uwsm
$APP = uwsm app --
$WIN = python3 -I $DESKTOP/hypr/window.py

source = $DESKTOP/hypr/env.conf
source = $DESKTOP/hypr/monitors.conf
source = $DESKTOP/hypr/general.conf
source = $DESKTOP/hypr/look.conf
source = $DESKTOP/hypr/rules.conf
source = $DESKTOP/hypr/pins.conf
source = $DESKTOP/hypr/binds.conf
source = $DESKTOP/hypr/autostart.conf
