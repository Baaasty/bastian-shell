# Tastenkürzel (docs/knowledge/hotkeys.md). Kacheln first: Fenster teilen den Schirm (dwindle). Super = Windows-/„Menü“-Taste.
# Schema (Bastian, verbindlich): Alt = Workspaces · Super = Fenster · Super+Alt = Menüs/Programme und Topbar.
# Topbar: Super+Leertaste = Bar-Modus; Super+Alt+<Buchstabe> = Bar-Modus + derselbe Buchstabe, die häufigsten ohne Alt
# (Super+F/T/A/E/B/I). Dazu nur Notfälle, Screenshots, Medientasten und ein paar Klassiker (Super+Enter/K/O/P/V …).
# Jede Kombination nur einmal – bei Dubletten gewinnt in Hyprland die erste.
# Flags: l = auch gesperrt, e = wiederholt beim Halten, r = beim Loslassen, i = Modifier egal,
#        t = durchlässig (wird von anderen Kürzeln nicht verdeckt), m = Maus.
# $IPC = qs ipc … call (Shell), $APP = uwsm app --  (hypr/window.py ist nicht mehr gebunden)
# Titel hinter jedem Bind ("# Titel") und die Abschnittsnamen hier füllt der Keybind-Viewer (Super+K).
# Ein Kommentar direkt über genau EINEM Bind wird dort zur Beschreibung (eine Zeile), über mehreren Binds zur reinen Notiz.

$LOCK = $DESKTOP/scripts/lock
$HYPR = $DESKTOP/scripts/hypr
$WINMOVE = python3 -I $DESKTOP/scripts/winmove

# ---------- Windows ----------
# Fokus mit Super+Pfeilen (alle vier Richtungen), Fenster verschieben mit Super+Shift+←/→ (springt am Rand auf den Nachbarmonitor)
bind = SUPER, Left, movefocus, l # Focus window
bind = SUPER, Right, movefocus, r # Focus window
bind = SUPER, Up, movefocus, u # Focus window
bind = SUPER, Down, movefocus, d # Focus window
bind = SUPER SHIFT, Left, exec, $WINMOVE dir l # Move window
bind = SUPER SHIFT, Right, exec, $WINMOVE dir r # Move window
# Super+Shift+↑/↓ (oder Alt+Shift+↑/↓) stufen: schwebend → normal → maximiert (Leisten der Shell bleiben) → Vollbild (scripts/winmove max)
bind = SUPER SHIFT, Up, exec, $WINMOVE max up # Bigger: floating → tiled → maximized → fullscreen
bind = SUPER SHIFT, Down, exec, $WINMOVE max down # Smaller: fullscreen → maximized → tiled → floating
bind = ALT SHIFT, Up, exec, $WINMOVE max up # Bigger: floating → tiled → maximized → fullscreen
bind = ALT SHIFT, Down, exec, $WINMOVE max down # Smaller: fullscreen → maximized → tiled → floating
# Größe per Taste (AP 22c): → breiter, ← schmaler, ↓ höher, ↑ niedriger; gekachelt verschiebt es die Teilung,
# schwebend die Fenstergröße. Halten wiederholt (e).
binde = SUPER CTRL, Right, resizeactive, 80 0 # Resize window: wider
binde = SUPER CTRL, Left, resizeactive, -80 0 # Resize window: narrower
binde = SUPER CTRL, Down, resizeactive, 0 60 # Resize window: taller
binde = SUPER CTRL, Up, resizeactive, 0 -60 # Resize window: shorter
# Fensterwechsler: Super halten + Tab. Loslassen von Super wählt (der Wechsler sieht das Loslassen nicht selbst,
# weil Hyprland die Super-Taste für das Kürzel „Dashboard“ schluckt) – „t“: wird von Super+Tab nicht verdeckt
bind = SUPER, Tab, exec, $IPC switcher next # Next window
bind = SUPER SHIFT, Tab, exec, $IPC switcher prev # Previous window
bindirt = , SUPER_L, exec, $IPC switcher confirm
# dasselbe mit Alt+Tab (Alt loslassen wählt). Ohne offenen Wechsler ist „confirm“ wirkungslos.
bind = ALT, Tab, exec, $IPC switcher next # Next window
bind = ALT SHIFT, Tab, exec, $IPC switcher prev # Previous window
bindirt = , ALT_L, exec, $IPC switcher confirm
# Fenster derselben App: Super + Taste links neben der 1 (US: ` und ~, DE: ^ und °)
bind = SUPER, code:49, exec, $IPC switcher nextApp # Next window of the same app
bind = SUPER SHIFT, code:49, exec, $IPC switcher prevApp # Previous window of the same app
bind = SUPER SHIFT, V, togglefloating # Toggle floating
# Rotate the split of the current pair (horizontal / vertical)
bind = SUPER, S, layoutmsg, togglesplit # Toggle split
bind = ALT, F4, killactive # Close window (quits Discord/Spotify too)
bind = SUPER, Q, exec, $IPC parked closeActive || hyprctl dispatch killactive # Close window (Discord/Spotify: back to the bar)
# Click a window to kill it – for hung apps
bind = SUPER CTRL, Escape, exec, hyprctl kill # Kill window
# Give the keyboard back after remote control / VM use
bind = SUPER SHIFT, Escape, releaseinputcapture # Release input capture

# ---------- Mouse ----------
# Maus: Super + links ziehen = verschieben, Super + rechts ziehen = Größe (Fenster haben keine Titelleiste).
# Beim Ziehen schrumpft das Fenster auf höchstens 960×600 und hängt mittig unter dem Zeiger – sonst sieht man beim
# Wechsel vom 2K- auf einen Full-HD-Monitor kaum, wohin es fällt. Gekachelte rasten beim Loslassen wie gewohnt ein.
# Wie: Markierung „dragging“ + Regel max_size in rules.conf; general.conf binds:drag_threshold sorgt dafür, dass
# Hyprland das Fenster erst nach ein paar Pixeln aus der Kachel löst – dann ist die Markierung schon da.
# Reihenfolge zählt: Hyprland führt alle Binds einer Taste in Dateireihenfolge aus.
#   davor:   Loslassen nimmt die Markierung weg, BEVOR movewindow endet (sonst passt das Fenster wegen max_size
#            nicht mehr in die Kachel und bliebe schwebend); i = auch wenn Super schon los ist, n = Klick geht an die App
#   danach:  Markieren – erst movewindow fokussiert das Fenster unter dem Zeiger, tagwindow trifft das aktive
# Die Helfer stehen in einer eigenen Submap mit u (gilt in allen Submaps): so zeigt sie der Keybind-Viewer nicht.
submap = mousedrag
bindirnu = , mouse:272, tagwindow, -dragging
submap = reset
bindm = SUPER, mouse:272, movewindow # Move window (drag)
submap = mousedrag
bindu = SUPER, mouse:272, tagwindow, +dragging
submap = reset
bindm = SUPER, mouse:273, resizewindow # Resize window (drag)

# ---------- Monitors ----------
# Monitore: Super+1/2/3 Fokus auf links/Mitte/rechts, Super+Shift+1/2/3 aktuelles Fenster dorthin.
# Mauszeiger springt in die Monitormitte mit (cursor:no_warps: sonst setzt Hyprland den Fokus zurück). Mitten = Monitor-Position + halbe Größe (monitors.conf).
bind = SUPER, code:10, exec, hyprctl --batch "dispatch focusmonitor HDMI-A-2 ; dispatch movecursor 960 900" # Focus monitor 1…3
bind = SUPER, code:11, exec, hyprctl --batch "dispatch focusmonitor DP-2 ; dispatch movecursor 3200 720" # Focus monitor 1…3
bind = SUPER, code:12, exec, hyprctl --batch "dispatch focusmonitor DP-1 ; dispatch movecursor 5440 900" # Focus monitor 1…3
bind = SUPER SHIFT, code:10, exec, $WINMOVE mon HDMI-A-2 # Move window to monitor 1…3
bind = SUPER SHIFT, code:11, exec, $WINMOVE mon DP-2 # Move window to monitor 1…3
bind = SUPER SHIFT, code:12, exec, $WINMOVE mon DP-1 # Move window to monitor 1…3

# ---------- Workspaces ----------
# Workspaces (in der UI „Workspaces“, in der Shell intern Desktops): über alle 3 Monitore gekoppelt –
# Workspace n = Hyprland-ws n (DP-2), 100+n (links), 200+n (rechts). Die Shell schaltet alle drei zusammen.
# Alt+→ / Alt+←: nächster / vorheriger Workspace, Leiste zeigt kurz wo
bind = ALT, Right, exec, $IPC workbar nextDesk # Next workspace
bind = ALT, Left, exec, $IPC workbar prevDesk # Previous workspace
# Alt+1…9 n-ter Workspace in der Leiste (Platz, nicht ws-Nummer), Alt+Shift+1…9 aktuelles Fenster dorthin schieben (code:10…18 = Zifferreihe, layoutunabhängig)
bind = ALT, code:10, exec, $IPC workbar goDesk 1 # Go to workspace 1…9
bind = ALT, code:11, exec, $IPC workbar goDesk 2 # Go to workspace 1…9
bind = ALT, code:12, exec, $IPC workbar goDesk 3 # Go to workspace 1…9
bind = ALT, code:13, exec, $IPC workbar goDesk 4 # Go to workspace 1…9
bind = ALT, code:14, exec, $IPC workbar goDesk 5 # Go to workspace 1…9
bind = ALT, code:15, exec, $IPC workbar goDesk 6 # Go to workspace 1…9
bind = ALT, code:16, exec, $IPC workbar goDesk 7 # Go to workspace 1…9
bind = ALT, code:17, exec, $IPC workbar goDesk 8 # Go to workspace 1…9
bind = ALT, code:18, exec, $IPC workbar goDesk 9 # Go to workspace 1…9
bind = ALT SHIFT, code:10, exec, $IPC workbar moveToDesk 1 # Move window to workspace 1…9
bind = ALT SHIFT, code:11, exec, $IPC workbar moveToDesk 2 # Move window to workspace 1…9
bind = ALT SHIFT, code:12, exec, $IPC workbar moveToDesk 3 # Move window to workspace 1…9
bind = ALT SHIFT, code:13, exec, $IPC workbar moveToDesk 4 # Move window to workspace 1…9
bind = ALT SHIFT, code:14, exec, $IPC workbar moveToDesk 5 # Move window to workspace 1…9
bind = ALT SHIFT, code:15, exec, $IPC workbar moveToDesk 6 # Move window to workspace 1…9
bind = ALT SHIFT, code:16, exec, $IPC workbar moveToDesk 7 # Move window to workspace 1…9
bind = ALT SHIFT, code:17, exec, $IPC workbar moveToDesk 8 # Move window to workspace 1…9
bind = ALT SHIFT, code:18, exec, $IPC workbar moveToDesk 9 # Move window to workspace 1…9
# Workspace mode: tap Alt (fires only if no other key came in between) or Alt+Esc –
# the bottom bar takes the keyboard (1–9, ←→ or Alt+←→, Enter, Del, N, R, T, Q = quick links + Git of the tile, Esc); again = close
bindr = ALT, ALT_L, exec, $IPC workbar mode # Workspace mode (tap Alt)
bind = ALT, Escape, exec, $IPC workbar mode # Workspace mode

# ---------- Topbar ----------
# The chips show their letter; ←/→ or Tab picks, Enter opens, Esc or Super+Space again closes
bind = SUPER, space, exec, $IPC barmode toggle # Bar mode (letter opens a popout)
# Häufige Ziele ohne Alt: Super+<Buchstabe> = Super+Leertaste, dann derselbe Buchstabe (shell/services/BarKeys.qml).
# Popouts per Taste haben Tastaturfokus und schließen nicht durch Weghovern; nochmal = zu.
# Dateien/Browser ohne laufende Shell: Dolphin bzw. Helium direkt (|| …). Super+W = alter Browser-Griff, bleibt.
bind = SUPER, F, exec, $IPC barmode popout focus # Focus
bind = SUPER, T, exec, $IPC barmode popout todo # Tasks
bind = SUPER, A, exec, $IPC barmode popout claudehub # Agents (Claude)
bind = SUPER, E, exec, $IPC barmode popout files || $APP org.kde.dolphin.desktop # Files
bind = SUPER, B, exec, $IPC barmode popout browser || $APP helium.desktop # Browser here: new tab, else new window
bind = SUPER, W, exec, $IPC barmode popout browser || $APP helium.desktop # Browser
bind = SUPER, I, exec, $IPC barmode popout settings # Settings
# Alle übrigen: Super+Alt+<Buchstabe>, Reihenfolge wie in der Bar. Server (H) ist der Reiter Server im Dev-Popout (BarKeys.aliases).
bind = SUPER ALT, P, exec, $IPC barmode popout share # Screen sharing: stop, forget
bind = SUPER ALT, M, exec, $IPC barmode popout spotify # Music (Spotify)
bind = SUPER ALT, C, exec, $IPC barmode popout discord # Chat (Discord)
bind = SUPER ALT, V, exec, $IPC barmode popout devservices # Dev services
bind = SUPER ALT, H, exec, $IPC barmode popout servers # Servers (consoles, upload, files, terminal)
bind = SUPER ALT, R, exec, $IPC barmode popout resources # Resources
bind = SUPER ALT, L, exec, $IPC barmode popout light # Light
bind = SUPER ALT, G, exec, $IPC barmode popout gear # Gear (devices)
bind = SUPER ALT, S, exec, $IPC barmode popout mixer # Sound mixer
bind = SUPER ALT, N, exec, $IPC barmode popout net # Network
bind = SUPER ALT, D, exec, $IPC barmode popout downloads # Downloads
bind = SUPER ALT, U, exec, $IPC barmode popout updates # Updates (package manager)
bind = SUPER ALT, Y, exec, $IPC barmode popout tray # Tray
# Benachrichtigungen per Tastatur: ↑↓ wählen, Enter öffnen, 1–3 Knöpfe, S später erinnern, Entf wegklicken, Esc zu
bind = SUPER ALT, Z, exec, $IPC barmode popout notifs # Notifications (keyboard)
bind = SUPER ALT, X, exec, $IPC popups dismissNewest # Dismiss newest notification

# ---------- Apps & menus ----------
# Tap Super alone – fires only if no other key was pressed in between
bindr = SUPER, SUPER_L, exec, $IPC dashboard toggle # Dashboard
bind = SUPER, Return, exec, $APP kitty.desktop # Terminal
# Drop-down terminal (scripts/dropterm): Kitty slides in from the top, stays alive in the background (docs/knowledge/shell-features.md)
bind = SUPER SHIFT, Return, exec, $DESKTOP/scripts/dropterm toggle # Drop-down terminal
bind = SUPER, V, exec, $IPC clip toggle # Clipboard history at the cursor (Enter pastes)
bind = SUPER, period, exec, $IPC emoji toggle # Emoji picker at the cursor (Enter inserts)
# Kürzel-Übersicht (liest diese Datei + hyprctl binds zur Laufzeit) und Paketmanager
bind = SUPER, K, exec, $IPC keys toggle # Keyboard shortcuts
bind = SUPER, P, exec, $IPC packages toggle # Package manager
# iCloud-Schlüsselbund (scripts/passwords): Strg+U Benutzer, Strg+P/Enter Passwort, Strg+T 2FA-Code
bind = SUPER, O, exec, $IPC passwords toggle # Passwords
# Window layouts: apply a saved layout, save this workspace, delete (shell menu; kdialog fallback without the shell, docs/knowledge/shell-features.md)
bind = SUPER ALT, K, exec, $IPC layouts toggle || $DESKTOP/scripts/layout menu # Layout menu
# Discord-Kameras (docs/knowledge/discord.md): alle an/aus, Overlay mit Super+Alt+Pfeilen in eine Ecke schieben
bind = SUPER, C, exec, $IPC cams toggle # Call cameras on/off
bind = SUPER ALT, Left, exec, $IPC cams move left # Call cameras: dock left
bind = SUPER ALT, Right, exec, $IPC cams move right # Call cameras: dock right
bind = SUPER ALT, Up, exec, $IPC cams move up # Call cameras: dock top
bind = SUPER ALT, Down, exec, $IPC cams move down # Call cameras: dock bottom

# ---------- Screenshots ----------
# Screenshot: Bereich (kopieren + speichern) · Strg+Druck: alle Monitore speichern + kopieren
bind = , Print, exec, $IPC snip region # Screenshot region
bind = SUPER SHIFT, S, exec, $IPC snip region # Screenshot region
bind = CTRL, Print, exec, $IPC snip all # Screenshot all monitors
bind = SUPER, R, exec, $IPC snip record # Screen recording
# Snip-Extras (docs/knowledge/shell-features.md): im Snip-Modus gehen auch T (Text), C (Farbe), P (Anpinnen) – Direktkürzel nur für
# Text und Anpinnen; die Pipette lebt nur im Snip (eine Pipette statt zwei Wege)
bind = SUPER SHIFT, T, exec, $IPC snip text # Snip text (OCR)
bind = SUPER SHIFT, P, exec, $IPC snip pin # Pin screenshot

# ---------- System ----------
bind = SUPER, Escape, exec, $IPC power toggle # Power menu
bind = SUPER, L, exec, $LOCK now # Lock screen
# End the Hyprland session (log out, close apps)
bind = SUPER SHIFT, M, exec, uwsm stop # Log out
# Emergency exit: shell off, terminal open, hint to log out
bind = CTRL ALT SHIFT, Q, exec, $HYPR panic # Panic: shell off
# Shell power menu; if the shell is not running, a dialog asks and logs out via uwsm
bind = CTRL ALT, Delete, exec, $HYPR power # Power menu (works without the shell)

# ---------- Media keys (auch gesperrt) ----------
# Lautstärke: bewusst KEINE Tasten – alles regelt Bastian am GoXLR, der PC-Ausgang bleibt fest auf 100 %
# (Wächter in shell/services/Audio.qml, Schalter ~/.config/desktop/audio.json; Doku docs/setup/goxlr.md)
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle # Mute
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle # Mute microphone
bindl = SUPER, XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle # Mute microphone
# Medien
bindl = , XF86AudioPlay, exec, $IPC media playPause # Play / pause
bindl = , XF86AudioPause, exec, $IPC media playPause # Play / pause
bindl = , XF86AudioNext, exec, $IPC media next # Next track
bindl = , XF86AudioPrev, exec, $IPC media previous # Previous track
bindl = , XF86AudioStop, exec, $IPC media stop # Stop
# Helligkeit (DDC/CI über die Shell), mit Shift feiner
bindel = , XF86MonBrightnessUp, exec, $IPC brightness up # Brightness up
bindel = , XF86MonBrightnessDown, exec, $IPC brightness down # Brightness down
bindel = SHIFT, XF86MonBrightnessUp, exec, $IPC brightness fineUp # Brightness up (fine)
bindel = SHIFT, XF86MonBrightnessDown, exec, $IPC brightness fineDown # Brightness down (fine)
# Power button: power menu
bindl = , XF86PowerOff, exec, $HYPR power # Power menu

# ---------- Kürzel-Sperre (Submap „modal“) ----------
# Aktiv, solange ein Shell-Panel mit Tastatur offen ist (Hypr.setModal) – dann gehen nur diese Kürzel, alle anderen
# Tasten ans Panel. Rettungsweg, falls die Shell hängt: Not-Aus (hebt die Sperre mit auf); nach einem Absturz setzt
# die neu startende Shell sie zurück. Keine Inline-Titel → erscheinen nicht im Keybind-Viewer.
submap = modal
bindr = SUPER, SUPER_L, exec, $IPC dashboard toggle
# Panel-Kürzel: direkt ins nächste Panel wechseln (das offene schließt sich, Hypr.panelOpened)
bind = SUPER, O, exec, $IPC passwords toggle
bind = SUPER, P, exec, $IPC packages toggle
bind = SUPER, K, exec, $IPC keys toggle
bind = CTRL ALT SHIFT, Q, exec, $HYPR panic
bind = CTRL ALT SHIFT, Q, submap, reset
submap = reset
