# hypridle – Leerlauf. Bewusst **kein** Abdunkeln/Ausschalten/Sperren beim bloßen Nichtstun: wer die Maus nicht
# bewegt, sitzt meist trotzdem davor (lesen, zuhören). Alles hier wirkt nur, wenn von Hand gesperrt ist (Super+L,
# Power-Menü): dann Monitore aus und später Standby. Sperre über scripts/lock (Quickshell, ohne Shell = hyprlock).
# Doku: docs/knowledge/hyprland.md
# Geladen über ~/.config/hypr/hypridle.conf (legt scripts/hypr install an: $DESKTOP = Repo-Pfad, dann source = hier).
#
# Gesperrt = weg: diese Stufen ignorieren Inhibits (Video-Tab, Discord), sonst ginge nie etwas aus.
# Die alte Kette (abdunkeln → Monitore aus → sperren) liegt in Git; scripts/idle + modules/idle bleiben zum Testen.
#
# Start: hypr/autostart.conf (exec-once = uwsm app -- hypridle)

$lock = $DESKTOP/scripts/lock

general {
    # loginctl lock-session (Launcher, before_sleep_cmd) landet hier
    lock_cmd = $lock now
    # vor Standby sperren (wie kscreenlocker LockOnResume)
    before_sleep_cmd = loginctl lock-session
    # nach Standby: Monitore an + PC-Beleuchtung neu setzen (AP 23, Hardware vergisst die Farbe; 3 s warten, bis
    # USB wieder da ist). Eigene Unit über uwsm, Hintergrund; ohne openrgb Exit 0. Doku docs/knowledge/hardware.md
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'; uwsm app -- $DESKTOP/scripts/rgb apply --boot --delay 3 &
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
    ignore_wayland_inhibit = false
    # kein unlock_cmd: entsperrt wird nur per Passwort
}

# gesperrt und 1 min nichts getan → Monitore aus (Plasma: TurnOffDisplayIdleTimeoutWhenLockedSec 60)
listener {
    timeout = 60
    ignore_inhibit = true
    on-timeout = $lock dpms-if-locked
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# gesperrt und 30 min nichts getan → Standby (sperrt vorher ohnehin, siehe before_sleep_cmd)
listener {
    timeout = 1800
    ignore_inhibit = true
    on-timeout = $lock suspend-if-locked
}
