# hypridle – Leerlauf wie bisher unter Plasma (keine eigene powerdevilrc/kscreenlockerrc-Zeiten gesetzt,
# also deren Standardwerte für Netzbetrieb: dimmen 5 min, sperren 5 min + 5 s Gnadenfrist,
# Monitore 1 min nach dem Sperren aus).
# Alles läuft über scripts/lock (Sperre = Quickshell, ohne Shell = hyprlock). Doku: docs/LOCKSCREEN.md
# Geladen über ~/.config/hypr/hypridle.conf (legt scripts/hypr install an: $DESKTOP = Repo-Pfad, dann source = hier).
#
# Fokus-Block läuft (Pomodoro): 5-min-Stufen überspringen, erst nach 15 min dimmen/sperren (Kamin nach 13 min).
# Videos/Spiele: Inhibits über D-Bus (org.freedesktop.ScreenSaver: Chrome, Firefox, mpv …), systemd-inhibit
# und Wayland (idle-inhibit, Hyprland-Fensterregel idleinhibit fullscreen) halten alle Stufen an.
# Standby nach 15 min (Plasma-Standard) bleibt aus: kam unter Plasma praktisch nie vor, weil Discord/Chrome/Claude
# dauerhaft Inhibits halten, und würde laufende Claude-Agents/Downloads unterbrechen. Zum Einschalten unten entkommentieren.
#
# Start: hypr/autostart.conf (exec-once = uwsm app -- hypridle)

$lock = $DESKTOP/scripts/lock
$idle = $DESKTOP/scripts/idle

general {
    # loginctl lock-session (Launcher, before_sleep_cmd) landet hier
    lock_cmd = $lock now
    # vor Standby sperren (wie kscreenlocker LockOnResume)
    before_sleep_cmd = loginctl lock-session
    # nach Standby: Monitore an + PC-Beleuchtung neu setzen (AP 23, Hardware vergisst die Farbe; 3 s warten, bis
    # USB wieder da ist). Eigene Unit über uwsm, Hintergrund; ohne openrgb Exit 0. Doku docs/RGB.md
    after_sleep_cmd = hyprctl dispatch dpms on; uwsm app -- $DESKTOP/scripts/rgb apply --boot --delay 3 &
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
    ignore_wayland_inhibit = false
    # kein unlock_cmd: entsperrt wird nur per Passwort
}

# von Hand gesperrt (Super+L) und 1 min nichts getan → Monitore aus (Plasma: TurnOffDisplayIdleTimeoutWhenLockedSec 60)
listener {
    timeout = 60
    on-timeout = $lock dpms-if-locked
    on-resume = hyprctl dispatch dpms on
}

# 3:00 Kamin-Idle (Idee q): ruhiger Kamin-Bildschirm auf dem Hauptmonitor, Nebenmonitore dunkel. KEINE Sperre,
# Taste/Maus beendet ihn sofort. Im Fokus-Block kommt er erst nach 13 min (siehe unten). Doku: docs/IDLE.md
# (Ablauf: 3:00 Kamin -> 5:00 dimmen -> 5:05 sperren -> 6:05 Monitore aus; die Zeiten ab dimmen sind unverändert)
listener {
    timeout = 180
    on-timeout = $idle show
    on-resume = $idle hide
}

# 5:00 dimmen (PowerDevil DimDisplayIdleTimeoutSec 300); Bewegung in den nächsten 5 s = weiter ohne Passwort
listener {
    timeout = 300
    on-timeout = $lock dim
    on-resume = $lock undim
}

# 5:05 sperren (kscreenlocker Timeout 5 min + LockGrace 5 s)
listener {
    timeout = 305
    on-timeout = $lock idle
}

# 1 min nach dem Sperren Monitore aus
listener {
    timeout = 365
    on-timeout = $lock dpms-if-locked
    on-resume = hyprctl dispatch dpms on
}

# Fokus-Block: Kamin erst nach 13 min (2 min vor dem Dimmen)
listener {
    timeout = 780
    on-timeout = $idle show force
    on-resume = $idle hide
}

# Fokus-Block: jetzt doch dimmen und sperren
listener {
    timeout = 900
    on-timeout = $lock dim force
    on-resume = $lock undim
}
listener {
    timeout = 905
    on-timeout = $lock idle force
}
listener {
    timeout = 965
    on-timeout = $lock dpms-if-locked
    on-resume = hyprctl dispatch dpms on
}

