# hypridle – Leerlauf. Sperre wie bisher unter Plasma (dessen Standard für Netzbetrieb: sperren nach 5 min + 5 s
# Gnadenfrist); davor sanft abdunkeln und Monitore aus statt Plasmas Dimmen nach 5 min.
# Sperre über scripts/lock (Quickshell, ohne Shell = hyprlock), Abdunkeln/Monitore aus über scripts/idle. Doku: docs/knowledge/hyprland.md
# Geladen über ~/.config/hypr/hypridle.conf (legt scripts/hypr install an: $DESKTOP = Repo-Pfad, dann source = hier).
#
# Fokus-Block läuft (Pomodoro): normale Stufen überspringen, alles 10 min später (abdunkeln 14:00, sperren 15:05).
# Videos/Spiele: Inhibits über D-Bus (org.freedesktop.ScreenSaver: Chrome, Firefox, mpv …), systemd-inhibit
# und Wayland (idle-inhibit, Hyprland-Fensterregel idleinhibit fullscreen) halten alle Stufen an.
# Standby nach 15 min (Plasma-Standard) bleibt aus: kam unter Plasma praktisch nie vor, weil Discord/Chrome/Claude
# dauerhaft Inhibits halten, und würde laufende Claude-Agents/Downloads unterbrechen. Zum Einschalten unten entkommentieren.
#
# Start: hypr/autostart.conf (exec-once = uwsm app -- hypridle)

$lock = $DESKTOP/scripts/lock
$idle = $DESKTOP/scripts/idle

general {
    # loginctl lock-session (Launcher, before_sleep_cmd) landet hier
    lock_cmd = $lock now
    # vor Standby sperren (wie kscreenlocker LockOnResume)
    before_sleep_cmd = loginctl lock-session
    # nach Standby: Monitore an + PC-Beleuchtung neu setzen (AP 23, Hardware vergisst die Farbe; 3 s warten, bis
    # USB wieder da ist). Eigene Unit über uwsm, Hintergrund; ohne openrgb Exit 0. Doku docs/knowledge/hardware.md
    after_sleep_cmd = hyprctl dispatch dpms on; uwsm app -- $DESKTOP/scripts/rgb apply --boot --delay 3 &
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
    ignore_wayland_inhibit = false
    # kein unlock_cmd: entsperrt wird nur per Passwort
}

# von Hand gesperrt (Super+L) und 1 min nichts getan → Monitore aus (Plasma: TurnOffDisplayIdleTimeoutWhenLockedSec 60)
listener {
    timeout = 60
    on-timeout = $lock dpms-if-locked
    on-resume = hyprctl dispatch dpms on
}

# Leerlauf-Kette: 4:00 langsam abdunkeln (60 s, alle Monitore) -> 5:00 Monitore aus (clean schwarz)
# -> 5:05 sperren. Jede Taste/Maus vor 5:05 = sofort wieder hell, ohne Passwort.
# Warum Monitore vor der Sperre aus: die Sperre ist hell und würde das sanfte Dunkel kurz aufreißen; so
# bleibt es dunkel und man sieht die Sperre erst beim Aufwecken. Gesperrt wird wie bisher nach 5:05.
# Doku: docs/knowledge/shell-features.md (Leerlauf-Abdunkeln)

# 4:00 abdunkeln: Overlay in 60 s (ease-in) bis 88 %, klickdurchlässig
listener {
    timeout = 240
    on-timeout = $idle dim
    on-resume = $idle undim
}

# 5:00 Monitore aus (DPMS); Bewegung in den nächsten 5 s = weiter ohne Passwort
listener {
    timeout = 300
    on-timeout = $idle black
    on-resume = hyprctl dispatch dpms on
}

# 5:05 sperren (kscreenlocker Timeout 5 min + LockGrace 5 s). Wieder aus nach dem Aufwecken: Listener 60 s oben.
listener {
    timeout = 305
    on-timeout = $lock idle
}

# Fokus-Block: jetzt doch – 14:00 abdunkeln, 15:00 Monitore aus, 15:05 sperren
listener {
    timeout = 840
    on-timeout = $idle dim force
    on-resume = $idle undim
}
listener {
    timeout = 900
    on-timeout = $idle black force
    on-resume = hyprctl dispatch dpms on
}
listener {
    timeout = 905
    on-timeout = $lock idle force
}

