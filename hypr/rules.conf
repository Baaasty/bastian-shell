# Fensterregeln (Syntax ab Hyprland 0.53: "windowrule = <wirkung> <wert>, match:<eigenschaft> <regex>, …").
# Regex = RE2 und muss den ganzen Wert treffen. Kein Komma und kein "#" in Regex (hyprlang trennt/kommentiert dort).

# --- Kacheln ist Standard (dwindle, general.conf): ein Fenster füllt den Schirm, ein zweites teilt ---
# Schweben nur, wo unten ausdrücklich "float on" steht (Dialoge, Picker, Bild im Bild, Share-Picker).
# Dazu schwebt, was Hyprland selbst als Dialog erkennt. Per Hand: Super+V (togglefloating).

# Vollbild (Videos, Spiele) hält hypridle an
windowrule = idle_inhibit fullscreen, match:class .*

# XWayland: Drag-Geister und leere Hilfsfenster nicht fokussieren (aus Hyprlands Beispielkonfiguration)
windowrule = no_focus on, match:class ^$, match:title ^$, match:xwayland 1, match:float 1, match:fullscreen 0, match:pin 0

# --- Startplatz wie scripts/winrules unter KWin (nur beim Öffnen, danach frei verschiebbar) ---
# VS Code (natives RPM meldet "code", Flatpak "com.visualstudio.code") → Mitte
windowrule = monitor DP-2, match:initial_class (?i)(code|code-url-handler|com\.visualstudio\.code|com\.microsoft\.vscode)
# Chrome / Helium → rechts
windowrule = monitor DP-1, match:initial_class (?i)(google-chrome|helium)
# Discord ist Hintergrund-App: beim Rausholen mittig auf dem Hauptmonitor
# Chat-Client (shell/services/Chat.qml): Discord-RPM = Klasse "discord", Flatpak "com.discordapp.Discord"; alt Equibop/Vesktop
windowrule = monitor DP-2, size 1600 1000, center on, match:initial_class (?i)(discord|com\.discordapp\.discord|equibop|vesktop)
# Discord/Spotify fordern oft „Aktivierung“ an (Nachricht, Songwechsel). Mit focus_on_activate holte Hyprland sie dann
# aus dem Versteck (special:parked…) auf DP-2 – weggeräumt muss weggeräumt bleiben (Holen macht die Bar per Dispatch)
windowrule = suppress_event activate activatefocus, match:class (?i)(discord|com\.discordapp\.discord|equibop|vesktop|spotify)
# Weggeräumt (special:parked) bekämen sie keine Frames mehr – Electron drosselt dann (Call/Stream/Video ruckeln).
# render_unfocused hält sie mit misc:render_unfocused_fps am Laufen, auch unsichtbar.
windowrule = render_unfocused on, match:class (?i)(discord|com\.discordapp\.discord|equibop|vesktop|spotify)
# Wegräumen/Holen ohne Animation: sonst gleitet das Fenster erst sichtbar über den Monitor (zum Versteck), bevor es verschwindet
windowrule = no_anim on, match:class (?i)(discord|com\.discordapp\.discord|equibop|vesktop|spotify)

# --- Steam und Spiele ---
# Steam (RPM steam, XWayland, Klasse "steam"): Hauptfenster (Titel "Steam") auf den Spiele-Monitor, gekachelt wie alles
# andere. Kleine Dialoge/Popups schweben von selbst, wenn Hyprland sie als Dialog erkennt (keine Regel nötig).
windowrule = monitor DP-2, match:initial_class (?i)steam, match:title Steam
# Spiele über Steam/Proton heißen steam_app_<id>: auf DP-2 (360 Hz), als Spiel markiert und Tearing erlaubt.
#   content game: die Shell nimmt dann Bar + Arbeitsplatz-Leiste ganz weg (Windows.game), sonst blockieren ihre
#                 Overlay-Flächen Tearing und direct scanout
#   immediate on: Tearing (weniger Latenz), greift nur mit general:allow_tearing (general.conf) und im echten Vollbild
# Vollbild nicht erzwingen: Launcher (EA, Ubisoft …) laufen unter derselben Klasse; Spiele schalten selbst um.
# Vollbild hält hypridle an (idle_inhibit fullscreen oben).
windowrule = monitor DP-2, content game, immediate on, match:class steam_app_.*

# --- Vollbild/Maximiert: wirklich randlos (kein Glut-Rand, keine runden Ecken, kein Schatten) ---
windowrule = border_size 0, rounding 0, no_shadow on, match:fullscreen 1

# --- Dialoge mittig und handlich ---
# KDE-Dateidialog (Portal), Polkit-Passwortabfrage
windowrule = float on, center on, size (monitor_w*0.55) (monitor_h*0.6), match:class org\.freedesktop\.impl\.portal\.desktop\.kde
windowrule = float on, center on, match:class org\.kde\.polkit-kde-authentication-agent-1
windowrule = float on, center on, match:title (Open File|Save As|Open Folder|Datei öffnen|Speichern unter|Ordner öffnen).*

# --- Bild im Bild (Chrome/Firefox): klein, oben auf allen Desktops, Seitenverhältnis fest ---
windowrule = float on, pin on, keep_aspect_ratio on, size (monitor_w*0.25) (monitor_h*0.25), move (monitor_w*0.73) (monitor_h*0.72), match:title (Picture.in.[Pp]icture|Bild.im.Bild)

# Bildschirmfreigabe-Hinweis (Chrome „… teilt Ihren Bildschirm“) nicht im Weg und auf allen Desktops
windowrule = float on, pin on, no_initial_focus on, match:title .*(is sharing (a window|your screen)|teilt (ein Fenster|Ihren Bildschirm)).*

# Layer der Shell: Blur kommt über ext-background-effect (BackgroundEffect.blurRegion im QML), keine Layer-Regel
# nötig. Öffnen-Animationen für Layer sind in look.conf aus (animation = layers, 0).

# Bildschirm-teilen-Auswahl (xdg-desktop-portal-hyprland) immer vorn, mittig, mit Fokus –
# lag sonst hinter angepinnten Fenstern (Discord) und Teilen ging „nicht“.
# Pins: siehe pins.conf
windowrule = float on, pin on, center on, stay_focused on, match:class hyprland-share-picker

# Neue Auswahl (hyprland-preview-share-picker, AP 16): ein Layer-Shell-Overlay (Namespace = App-ID), kein Fenster –
# liegt von selbst über allem (auch über angepinnten Fenstern), die windowrule oben greift dafür nicht
# (sie bleibt für den Standard-Picker, falls xdph.conf mal zurückgebaut wird: scripts/share-picker off).
# Nur die Öffnen-Animation weg (wie bei den Shell-Layern).
layerrule = no_anim on, match:namespace ^ch\.wysbd\.hyprland-preview-share-picker$

# --- Drop-down-Terminal (scripts/dropterm, Super+Shift+Return) ---
# Bewusste Ausnahme von „nichts schwebt“: nur diese Kitty-Klasse (kitty --class kitty-drop) schwebt, oben mittig,
# 80 % Breite × 45 % Höhe, im Spezial-Workspace "dropterm" (nur auf Abruf sichtbar). Das Skript setzt Größe und
# Platz beim Einblenden zusätzlich neu (Bar-Abstand, anderer Monitor). Normale Kitty-Fenster (Klasse "kitty") bleiben gekachelt.
windowrule = float on, workspace special:dropterm, size (monitor_w*0.8) (monitor_h*0.45), move (monitor_w*0.1) 56, match:class ^kitty-drop$

# Xwayland Video Bridge (KDE-Helfer fürs Bildschirmteilen alter X11-Apps): läuft dauerhaft und zeigte beim Teilen ein
# leeres schwarzes Fenster – gehört unsichtbar in einen eigenen Spezial-Workspace (nie einblenden)
windowrule = workspace special:bridge silent, no_initial_focus on, match:class ^(xwaylandvideobridge)$
