# Obergrenze für alle Apps zusammen (app.slice: VS Code, Browser, Discord, Terminals …), 31 GB RAM im PC.
# Ohne Grenze lief der RAM mehrfach voll (meist VS Code samt Claude-Sitzungen, 16–25 GB) und der PC fror minutenlang
# ein, statt dass etwas beendet wurde. Hyprland und Shell laufen in session.slice (Shell: Slice= in ihrer Unit) und behalten so Luft.
# High: ab hier drosselt und lagert der Kernel die Apps aus · Max: darüber beendet er den größten Prozess in app.slice
[Slice]
MemoryHigh=24G
MemoryMax=27G
# oomd greift bei anhaltendem Speicherdruck früher (Fedora-Standard 80 % für 20 s war zu spät, PC stand schon)
ManagedOOMMemoryPressure=kill
ManagedOOMMemoryPressureLimit=50%
ManagedOOMMemoryPressureDurationSec=10s
