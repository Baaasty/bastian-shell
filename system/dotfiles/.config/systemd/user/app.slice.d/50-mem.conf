# Obergrenze für alle Apps zusammen (app.slice: VS Code, Browser, Discord, Terminals …), 31 GB RAM im PC.
# Nur noch Schutz gegen das Einfrieren: ohne Grenze lief der RAM mehrfach voll und der PC stand minutenlang.
# Hyprland und Shell laufen in session.slice (Shell: Slice= in ihrer Unit) und behalten die letzten ~3 GB.
# High: ab hier drosselt und lagert der Kernel die Apps aus · Max: darüber beendet er einen einzelnen Prozess
# (den größten), nicht die ganze App – dafür OOMPolicy=continue in app-.scope.d/50-oom.conf
[Slice]
MemoryHigh=27G
MemoryMax=28G
# oomd beendet immer eine ganze App samt allen Fenstern (2026-11-04: VS Code mit allen Claude-Sitzungen),
# daher hier aus; letzte Reserve bleibt Fedoras oomd-Regel auf user@.service (80 % Druck für 20 s)
ManagedOOMMemoryPressure=auto
