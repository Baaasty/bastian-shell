# desktop: Login-Greeter im Lockscreen-Look (scripts/loginscreen apply; zurück: scripts/loginscreen restore)
# Liegt als /var/lib/plasmalogin/.config/systemd/user/plasma-login.service.d/desktop-login.conf
#
# Das Theme hängt per QML_IMPORT_PATH eine eigene org.kde.breeze.components ein (Greeter-Binary bleibt original).
# Sicherung: nur wenn der Fingerabdruck stimmt (Greeter-Binary, Breeze-Komponenten des Systems, unsere Dateien –
# also nach jedem Plasma-Update erst wieder nach `scripts/loginscreen apply`) und keine Datei „off“ liegt.
# Sonst startet der normale Greeter. bash und sha256sum kommen aus dem System, nichts aus dem Home wird ausgeführt.
[Service]
ExecStart=
ExecStart=/usr/bin/bash -c 'd=%h/.local/share/desktop-login; if [ ! -e "$$d/off" ] && (cd "$$d" && sha256sum --quiet --strict -c fingerprint.sha256) >/dev/null 2>&1; then export QML_IMPORT_PATH="$$d/qml"; echo "desktop-login: theme on" >&2; else echo "desktop-login: theme off (fingerprint mismatch or off file) - stock greeter" >&2; fi; exec /usr/libexec/plasma-login-greeter'
